<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ferry</title>
<style>
  :root { color-scheme: light dark; --bg: #0b0d10; --fg: #f3f4f6; --muted: #9aa3ad; }
  @media (prefers-color-scheme: light) { :root { --bg: #ffffff; --fg: #0b0d10; --muted: #5b6470; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; padding: 0 16px; }
  main { text-align: center; max-width: 28rem; }
  h1 { font-size: 2.25rem; margin: 0 0 .5rem; letter-spacing: -0.02em; }
  p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Ferry</h1>
  <p>Send dollars across borders from your phone. Settled in a second.</p>
</main>
</body>
</html>
