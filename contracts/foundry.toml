[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true

[rpc_endpoints]
monad_mainnet = "https://rpc.monad.xyz"
monad_testnet = "https://testnet-rpc.monad.xyz"
