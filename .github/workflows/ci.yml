name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app-checks:
    name: App and API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx turbo run lint check-types test
      - run: npm --workspace @ferry/api run build

  contract-checks:
    name: Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install pinned forge-std
        run: forge install foundry-rs/forge-std@rev=77041d2ce690e692d6e03cc812b57d1ddaa4d505 --no-git
      - run: forge fmt --check
      - run: forge build --sizes
      - name: Test local flow behavior
        run: forge test -vvv --match-path 'test/FerryFlow*.t.sol'
      - name: Test Monad testnet deployment
        run: forge test -vvv --rpc-url monad_testnet --match-path test/DeployFerryFlow.t.sol
      - name: Test Monad testnet settlement
        run: forge test -vvv --rpc-url monad_testnet --match-path test/FerrySettlement.t.sol
      - name: Test Monad mainnet deployment
        run: forge test -vvv --rpc-url monad_mainnet --match-path test/DeployFerryFlowMainnet.t.sol
