services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ferry
      POSTGRES_PASSWORD: ferry
      POSTGRES_DB: ferry
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferry -d ferry"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
